<style>
        body {
            background-color: #f9f9f9;
            font-family: 'Roboto Flex', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Subtle pulsating animation for the logo */
        @keyframes soft-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.95; }
        }

        .animate-soft-pulse {
            animation: soft-pulse 3s ease-in-out infinite;
        }

        /* Loading bar animation */
        @keyframes progress-loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-bar-fill {
            animation: progress-loading 2s infinite ease-in-out;
        }

        /* Entrance animations */
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s forwards ease-out;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
    </style>

<span class="font-label-md text-label-md text-outline tracking-wider uppercase opacity-80" id="status-text">
                Initializing...
            </span>
</div>
</main>
<!-- Decorative Background Elements (Authority & Vigilance) -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none overflow-hidden -z-10">
<!-- Subtle grid pattern -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#004d99 1px, transparent 1px); background-size: 32px 32px;">
</div>
<!-- Abstract gradient blurs -->
<div class="absolute -top-1/4 -right-1/4 w-1/2 h-1/2 bg-secondary-container opacity-10 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-1/4 -left-1/4 w-1/2 h-1/2 bg-primary-container opacity-10 blur-[120px] rounded-full"></div>
</div>
<script>
        // Micro-interaction: Update status text randomly to simulate loading
        const statusText = document.getElementById('status-text');
        const statuses = [
            "Initializing...",
            "Checking Security...",
            "Encrypting Session...",
            "Verifying Assets...",
            "Finalizing Setup..."
        ];
        let index = 0;

        const interval = setInterval(() => {
            index++;
            if (index < statuses.length) {
                statusText.style.opacity = 0;
                setTimeout(() => {
                    statusText.textContent = statuses[index];
                    statusText.style.opacity = 0.8;
                }, 300);
            } else {
                clearInterval(interval);
                // In a real app, this would trigger navigation to the main dashboard
                console.log("Ready to launch");
            }
        }, 1500);

        // Simple fade out transition simulation
        document.body.addEventListener('click', () => {
            document.body.style.transition = 'opacity 0.5s ease-out';
            document.body.style.opacity = 0;
        });
    </script>
